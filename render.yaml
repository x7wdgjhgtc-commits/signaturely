services:
  - type: web
    name: signaturely
    runtime: node
    plan: starter
    region: oregon
    branch: main
    autoDeploy: true
    healthCheckPath: /api/health
    # Include dev deps so vite/esbuild are available during build.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/index.cjs
    disk:
      name: signaturely-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: DATA_DIR
        value: /var/data
      - key: SESSION_SECRET
        generateValue: true
      - key: PUBLIC_APP_URL
        value: https://signaturely.onrender.com
      # Set in Render dashboard after Stripe is ready:
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_STARTER
        sync: false
      - key: STRIPE_PRICE_GROWTH
        sync: false
      - key: STRIPE_PRICE_BUSINESS
        sync: false
